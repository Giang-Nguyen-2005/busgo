spring:
  application:
    name: busgo
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    time-zone: UTC
  flyway:
    enabled: true
busgo:
  jwt:
    secret: ${JWT_SECRET}
    issuer: busgo
    access-ttl: ${JWT_ACCESS_TTL:1h}
    refresh-ttl: ${JWT_REFRESH_TTL:7d}
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

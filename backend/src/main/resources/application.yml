spring:
  application:
    name: busgo
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    time-zone: UTC
  flyway:
    enabled: true
busgo:
  jwt:
    secret: ${JWT_SECRET}
    issuer: busgo
    access-ttl: ${JWT_ACCESS_TTL:1h}
    refresh-ttl: ${JWT_REFRESH_TTL:7d}
  booking:
    seat-hold-duration: ${SEAT_HOLD_DURATION:PT10M}
    max-seats-per-hold: ${MAX_SEATS_PER_HOLD:5}
    seat-hold-cleanup-interval: ${SEAT_HOLD_CLEANUP_INTERVAL:PT1M}
    seat-hold-cleanup-initial-delay: ${SEAT_HOLD_CLEANUP_INITIAL_DELAY:PT1M}
  system-admin-bootstrap:
    enabled: ${BUSGO_SYSTEM_ADMIN_BOOTSTRAP_ENABLED:false}
    full-name: ${BUSGO_SYSTEM_ADMIN_FULL_NAME:}
    email: ${BUSGO_SYSTEM_ADMIN_EMAIL:}
    phone: ${BUSGO_SYSTEM_ADMIN_PHONE:}
    password: ${BUSGO_SYSTEM_ADMIN_PASSWORD:}
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
